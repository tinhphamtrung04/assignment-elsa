services:
  toolbox:
    image: ubuntu:22.04
    container_name: k3d-toolbox
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          curl bash git docker.io ca-certificates gnupg

        # Install Terraform from HashiCorp's official APT repository.
        curl -fsSL https://apt.releases.hashicorp.com/gpg \
          | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(. /etc/os-release && echo \"$$VERSION_CODENAME\") main" \
          > /etc/apt/sources.list.d/hashicorp.list

        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y terraform

        # Install the official k6 standalone binary. This avoids relying on
        # distro package indexes that may not expose k6 on every architecture.
        case "$$(dpkg --print-architecture)" in
          amd64) K6_ARCH="amd64" ;;
          arm64) K6_ARCH="arm64" ;;
          *) echo "Unsupported k6 architecture" >&2; exit 1 ;;
        esac
        K6_VERSION="$$(curl -fsSL https://api.github.com/repos/grafana/k6/releases/latest \
          | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p' | head -n 1)"
        test -n "$${K6_VERSION}"
        curl -fsSL "https://github.com/grafana/k6/releases/download/$${K6_VERSION}/k6-$${K6_VERSION}-linux-$${K6_ARCH}.tar.gz" \
          | tar -xz -C /tmp
        install "/tmp/k6-$${K6_VERSION}-linux-$${K6_ARCH}/k6" /usr/local/bin/k6
        rm -rf "/tmp/k6-$${K6_VERSION}-linux-$${K6_ARCH}"
        
        # Install k3d
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash
        
        # Install kubectl
        case "$$(dpkg --print-architecture)" in
          amd64) KUBECTL_ARCH="amd64" ;;
          arm64) KUBECTL_ARCH="arm64" ;;
          *) echo "Unsupported kubectl architecture" >&2; exit 1 ;;
        esac
        curl -LO "https://dl.k8s.io/release/$$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/$${KUBECTL_ARCH}/kubectl"
        chmod +x kubectl && mv kubectl /usr/local/bin/
        
        # Install Helm
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

        # Fail Compose startup if a required toolbox command is unavailable.
        for required_tool in kubectl helm terraform k6; do
          if ! command -v "$${required_tool}" >/dev/null 2>&1; then
            echo "ERROR: required toolbox command is not installed: $${required_tool}" >&2
            exit 1
          fi
          case "$${required_tool}" in
            kubectl) tool_version="$$(kubectl version --client --output=yaml 2>/dev/null | awk -F': ' '/gitVersion:/ { print $2; exit }')" ;;
            helm) tool_version="$$(helm version --short 2>/dev/null)" ;;
            terraform) tool_version="$$(terraform version 2>/dev/null | head -n 1)" ;;
            k6) tool_version="$$(k6 version 2>/dev/null | head -n 1)" ;;
          esac
          echo "==> Verified toolbox command: $${required_tool} ($$(command -v "$${required_tool}")) - $${tool_version}"
        done

        # Bootstrap the local Kubernetes cluster as part of Compose startup.
        # The check keeps docker compose up -d idempotent.
        if ! k3d cluster list | grep -q "assignment"; then
          k3d cluster create assignment \
            --agents 4 \
            --api-port 6443 \
            --wait
        fi

        # Apply the required local nodepool labels and GPU taint.
        bash /workspace/troubleshoot/prepare.sh
        
        echo "==> Toolbox ready! Keeping container alive..."
        tail -f /dev/null
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - KUBECONFIG=/root/.kube/config
      - DOCKER_API_VERSION=1.44
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          kubectl get nodes --no-headers 2>/dev/null |
          awk 'NF > 0 { count++ } END { exit !(count >= 5) }'
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
