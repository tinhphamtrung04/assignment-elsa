replicaCount: 3

image:
  repository: ghcr.io/tinhphamtrung04/assignment1
  pullPolicy: IfNotPresent
  tag: "64aded6" # Overridden by ArgoCD/Git SHA

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: quote-api.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2 # Ensures rolling updates/drains do not take down all pods

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

nodePlacement:
  capacityKey: "acme.io/capacity"
  spotValue: "spot"
  onDemandValue: "on-demand"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: acme.io/capacity
              operator: In
              values:
                - spot
                - on-demand
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: acme.io/capacity
              operator: In
              values:
                - spot
      - weight: 50
        preference:
          matchExpressions:
            - key: acme.io/capacity
              operator: In
              values:
                - on-demand

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: acme.io/capacity
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: quote-api
        app.kubernetes.io/instance: quote-api
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: quote-api
        app.kubernetes.io/instance: quote-api
